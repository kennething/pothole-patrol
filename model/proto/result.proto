syntax = "proto3";

package result;

service ProcessingService {
  rpc StreamResults(StreamRequest)
    returns (stream ProcessingResult);
}

message StreamRequest {
  string stream_id = 1;
}

message ProcessingResult {
  string uuidv7 = 1;
  uint32 timestamp = 2;

  double latitude = 3;
  double longitude = 4;
  
  // scores 0-100
  uint32 overall_score = 5;
  uint32 area_transit_ridership = 6;
  uint32 area_gdp = 7;
  uint32 area_income = 8;
  uint32 area_commercial = 9;
  uint32 traffic_density = 10;
  uint32 pothole_severity = 11;
}
